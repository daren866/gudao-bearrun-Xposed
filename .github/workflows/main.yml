name: Build LSPosed Module APK

on:
  push:
    branches: [ "main" ]          # 当推送到 main 分支时触发
  pull_request:
    branches: [ "main" ]          # 当向 main 分支发起 PR 时触发
  workflow_dispatch:               # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'   # 如果项目包含子模块，一并检出

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'    # Eclipse Temurin JDK
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew assembleDebug   # 构建 debug 版本（无需签名）

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lsposed-module-debug-apk
          path: app/build/outputs/apk/debug/*.apk   # 上传生成的 debug APK
          if-no-files-found: error
